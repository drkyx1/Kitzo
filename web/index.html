<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Kitzo · Manutenção do Windows</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- Barra de progresso global (aparece enquanto há requisições em andamento) -->
  <div class="progresso" aria-hidden="true"><div class="progresso-barra"></div></div>

  <div class="app">
    <!-- Menu lateral -->
    <aside class="lateral" id="lateral">
      <div class="marca">
        <span class="marca-logo" data-icone="bigorna"></span>
        <div>
          <strong>Kitzo</strong>
          <small>manutenção do Windows</small>
        </div>
      </div>

      <nav class="menu" aria-label="Seções">
        <a href="#inicio"      data-pagina="inicio"      data-icone="casa">Início</a>
        <a href="#diagnostico" data-pagina="diagnostico" data-icone="pulso">Diagnóstico</a>
        <a href="#reparo"      data-pagina="reparo"      data-icone="chave">Reparo</a>
        <a href="#limpeza"     data-pagina="limpeza"     data-icone="lixeira">Limpeza</a>
        <a href="#programas"   data-pagina="programas"   data-icone="grade">Programas</a>
        <a href="#rede"        data-pagina="rede"        data-icone="globo">Rede</a>
        <a href="#seguranca"   data-pagina="seguranca"   data-icone="escudo">Segurança</a>
        <a href="#relatorio"   data-pagina="relatorio"   data-icone="documento">Relatório</a>
        <a href="#historico"   data-pagina="historico"   data-icone="relogio">Histórico</a>
      </nav>

      <div class="lateral-rodape">
        <div class="info-pc" id="infoPc"><span class="suave">Conectando…</span></div>
        <button type="button" class="botao botao-fantasma botao-bloco" id="btnEncerrar">
          <span data-icone="energia"></span> Encerrar servidor
        </button>
      </div>
    </aside>
    <div class="veu" id="veu"></div>

    <!-- Área principal -->
    <div class="principal">
      <header class="topo">
        <button type="button" class="botao-menu" id="btnMenu" aria-label="Abrir menu" data-icone="menu"></button>
        <h1 id="tituloPagina">Início</h1>
        <div class="topo-acoes" id="topoAcoes"></div>
      </header>
      <main class="conteudo" id="conteudo"></main>
    </div>
  </div>

  <!-- Mensagens rápidas (toasts) -->
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <!-- Janela de confirmação usada por toda ação que altera o sistema -->
  <dialog class="dialogo" id="dialogo">
    <form method="dialog">
      <h2 id="dialogoTitulo">Confirmar</h2>
      <div class="dialogo-texto" id="dialogoTexto"></div>
      <div class="dialogo-botoes">
        <button type="submit" value="cancelar" class="botao botao-fantasma">Cancelar</button>
        <button type="submit" value="ok" class="botao botao-perigo" id="dialogoOk">Confirmar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
